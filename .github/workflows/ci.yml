name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tscms
          POSTGRES_PASSWORD: tscms
          POSTGRES_DB: tscms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tscms -d tscms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tscms:tscms@127.0.0.1:5432/tscms_test
      JWT_SECRET: test-secret-test-secret-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm exec eslint .
      - run: pnpm exec vitest run
