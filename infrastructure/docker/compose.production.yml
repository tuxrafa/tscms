services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tscms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tscms
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tscms -d tscms"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://tscms:${POSTGRES_PASSWORD}@postgres:5432/tscms
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 3000
      AUTHOR_ORIGIN: https://rafaellain.com
      JWT_SECRET: ${JWT_SECRET}
      MEDIA_ROOT: /data/media
      PUBLISH_ROOT: /data/published
    volumes:
      - media:/data/media
      - published:/data/published
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    ports:
      - 127.0.0.1:3011:80
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  media:
  published:
