# TSCMS on the existing rafaellain.com certificate.
# Studio: https://rafaellain.com/tscms/
# API:    https://rafaellain.com/v1/

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 120
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

ProxyPass        /health http://127.0.0.1:3011/health retry=0 timeout=120
ProxyPassReverse /health http://127.0.0.1:3011/health
ProxyPass        /ready http://127.0.0.1:3011/ready retry=0 timeout=120
ProxyPassReverse /ready http://127.0.0.1:3011/ready

ProxyPass        /tscms/ http://127.0.0.1:3011/tscms/ retry=0 timeout=120
ProxyPassReverse /tscms/ http://127.0.0.1:3011/tscms/
RedirectMatch 308 ^/tscms$ /tscms/

ProxyPass        /v1/ http://127.0.0.1:3011/v1/ retry=0 timeout=120
ProxyPassReverse /v1/ http://127.0.0.1:3011/v1/

ProxyPass        /docs-json http://127.0.0.1:3011/docs-json retry=0 timeout=120
ProxyPassReverse /docs-json http://127.0.0.1:3011/docs-json
ProxyPass        /docs http://127.0.0.1:3011/docs retry=0 timeout=120
ProxyPassReverse /docs http://127.0.0.1:3011/docs
